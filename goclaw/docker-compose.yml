services:
  goclaw:
    image: ghcr.io/roelfdiedericks/goclaw:latest
    container_name: goclaw-agent-gateway
    restart: unless-stopped
    ports:
      - "1337:1337"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
    volumes:
      - ./goclaw.json:/root/.goclaw/goclaw.json:ro
      - ./users.json:/root/.goclaw/users.json:ro
      - ./prompts:/root/.goclaw/prompts:ro
      - ./data:/root/.goclaw/data
      - ./sessions:/root/.goclaw/sessions
