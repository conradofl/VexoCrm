# GoClaw Architecture Configuration
# Geração Digital & Vexo OS

llm:
  providers:
    gemini:
      driver: openai
      baseURL: "https://generativelanguage.googleapis.com/v1beta/openai/"
      apiKey: "${GEMINI_API_KEY}"
      thinkingLevel: "off"
    groq:
      driver: openai
      baseURL: "https://api.groq.com/openai/v1"
      apiKey: "${GROQ_API_KEY}"
      thinkingLevel: "off"
  
  agent:
    models:
      - "gemini/gemini-3-flash-preview"
      - "groq/openai/gpt-oss-120b"
      - "gemini/gemini-flash-latest"
  
  subagent:
    models:
      - "gemini/gemini-3.1-flash-lite-preview"
      - "groq/openai/gpt-oss-20b"

  summarization:
    models:
      - "gemini/gemini-3.1-flash-lite-preview"
      - "groq/openai/gpt-oss-20b"

thinking: false

channels:
  telegram:
    enabled: false
  
  whatsapp:
    enabled: false
  
  http:
    enabled: true
    listen: ":1337"

# Concorrência e Isolamento de Lanes
lanes:
  # Lane 1: Maestro (COO de IA)
  maestro:
    name: "COO Maestro"
    description: "General da operação e alinhamento diário com os sócios (Conrado & Caio)"
    driver: "openai"
    model: "gemini/gemini-3-flash-preview"
    systemPromptFile: "prompts/maestro_coo.md"
    channels:
      - "http"
    concurrency: 4
    memory:
      transcriptSearch: true
      vectorStore: "sqlite"
      retentionDays: 90

  # Lane 2: Onboarding (Gestor Digital)
  onboarding:
    name: "Gestor Digital Onboarding"
    description: "Recepção de novos clientes, coleta de briefing guiado e acessos nas primeiras 48h"
    driver: "openai"
    model: "gemini/gemini-3-flash-preview"
    systemPromptFile: "prompts/gestor_digital_onboarding.md"
    channels:
      - "http"
    concurrency: 8
    tools:
      - "google_drive"
      - "whatsapp_evolution"

  # Lane 3: Gestor de Demandas (Auditoria Sob Demanda — envios diários automáticos 09h/18h desarmados para economia de tokens)
  demandas_cron:
    name: "Auditor de Demandas & Prazos"
    description: "Auditoria operacional sob demanda de cartões no Trello e relatórios no WhatsApp"
    driver: "openai"
    model: "gemini/gemini-3-flash-preview"
    systemPromptFile: "prompts/gestor_demandas_auditor.md"
    schedules: []

  # Lane 4: Heloísa (Secretária Executiva & Copiloto dos Sócios)
  heloisa:
    name: "Heloísa Secretária Executiva"
    description: "Copiloto dos sócios Conrado e Caio no WhatsApp com comandos de voz e texto"
    driver: "openai"
    model: "gemini/gemini-3-flash-preview"
    systemPromptFile: "prompts/heloisa_executiva.md"
    channels:
      - "http"
    concurrency: 4
    tools:
      - "whatsapp_evolution"
      - "trello"
      - "google_calendar"
      - "vexo_crm"

session:
  store: "sqlite"
  storePath: "./data/goclaw_sessions.db"
  inherit: false

memoryGraph:
  dbPath: "data/memory_graph.db"

security:
  sandbox: true
  panicStop: true

roles:
  colaborador:
    tools:
      - "message"
      - "web_search"
      - "web_fetch"
      - "memory_graph"
      - "document_extract"
    skills: []
    memory: "none"
    transcripts: "own"
    commands: false

