name: Stabilization CI

on:
  pull_request:
    branches:
      - main
      - codex/stabilization-maps
      - codex/**
      - fix/**

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: |
          npm test -- --maxWorkers=1 &
          TESTPID=$!
          while kill -0 "$TESTPID" 2>/dev/null; do
            echo "[probe] $(date -u +%T) mem=$(free -m | awk '/Mem:/{print $7}')MB_avail disk=$(df -m . | awk 'NR==2{print $4}')MB_free"
            sleep 10
          done
          wait "$TESTPID"  

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build

  diff:
    name: Diff hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace
        run: git diff --check origin/${{ github.base_ref }}...HEAD
